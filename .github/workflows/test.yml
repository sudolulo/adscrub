name: Test Python

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install ffmpeg
        # The cut tests exec the real ffmpeg binary; GitHub's ubuntu-latest image
        # doesn't ship it (the Gitea runner image does — installing is a no-op there).
        run: |
          if command -v ffmpeg >/dev/null; then echo "ffmpeg present"; exit 0; fi
          if command -v sudo >/dev/null; then SUDO=sudo; else SUDO=; fi
          $SUDO apt-get update -qq && $SUDO apt-get install -y -qq ffmpeg

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest
